name: Deploy Sui Contract

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Sui CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/MystenLabs/sui/main/scripts/sui-install.sh | sh
          echo "$HOME/.sui/bin" >> $GITHUB_PATH

      - name: Configure Sui client
        run: |
          sui client new-address ed25519
          sui client switch --address $(sui client addresses | head -1)

      - name: Publish contract
        run: |
          sui client publish --gas-budget 500000000
